<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Daddy和应帆的共读书房</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="libraryView" class="library-view">
    <header class="library-header">
      <div>
        <p class="eyebrow">DADDY × 应帆</p>
        <h1>我们的书架</h1>
        <p class="library-copy">同一本书，同一段进度，同一个 Daddy。</p>
      </div>
      <button id="importButton" class="import-button" aria-label="导入书籍">＋<span>导入</span></button>
    </header>

    <button id="aiBindingButton" class="ai-binding" type="button">
      <span class="ai-binding-dot"></span>
      <span><b id="aiBindingTitle">选择共读 Daddy</b><small id="aiBindingCopy">批注会送进这个聊天窗口</small></span>
      <i>›</i>
    </button>

    <section id="library" class="shelf-grid" aria-label="书架"></section>
    <section id="bookmarkPanel" class="bookmark-panel" hidden></section>
    <div id="empty" class="empty-state" hidden>
      <span>📖</span>
      <b>书架还是空的</b>
      <p>先导入一本 TXT 或 Markdown，和 Daddy 从第一段开始。</p>
    </div>
  </main>

  <nav class="library-nav" aria-label="书房导航">
    <button class="nav-item is-active" data-view="library"><span>▰</span>书架</button>
    <button class="nav-item" data-view="bookmarks"><span>🔖</span>书签</button>
    <button class="nav-item" data-view="about"><span>♡</span>共读</button>
  </nav>

  <section id="reader" class="reader-layer theme-paper controls-hidden" hidden>
    <div id="dimmer" class="reader-dimmer"></div>
    <header class="reader-chrome reader-top">
      <div class="reader-heading">
        <button id="back" class="round-button" aria-label="回到书架">‹</button>
        <button id="tocButton" class="reader-title" aria-label="打开章节目录">
          <b id="bookTitle"></b>
          <small id="pageInfo"></small>
        </button>
        <button id="bookmarkButton" class="round-button" aria-label="添加书签">🔖</button>
      </div>
      <label class="progress-wrap" aria-label="全书进度">
        <input id="readingProgress" type="range" min="1" max="1" value="1">
      </label>
    </header>

    <article id="readerContent" class="reader-content">
      <p id="chapterHint" class="chapter-hint"></p>
      <div id="text" class="book-text"></div>
      <p id="loadingMore" class="loading-more" hidden>正在翻到下一段…</p>
    </article>

    <nav class="reader-chrome reader-tools" aria-label="阅读设置">
      <button id="tocTool" class="tool-button"><span>☷</span>目录</button>
      <button id="fontDown" class="tool-button"><span>A−</span>字号</button>
      <button id="fontUp" class="tool-button"><span>A＋</span>放大</button>
      <button id="themeButton" class="tool-button"><span>◐</span>背景</button>
      <label class="tool-slider"><span>☀</span><input id="brightness" type="range" min="0" max="62" step="1" value="0"></label>
    </nav>

    <button id="selectionAction" class="selection-action" hidden>
      <span id="selectionPreview"></span><b>写下感想</b>
    </button>
  </section>

  <section id="tocSheet" class="modal" hidden>
    <button class="modal-scrim" data-close-modal aria-label="关闭目录"></button>
    <div class="sheet-card toc-card">
      <div class="sheet-heading"><b>章节目录</b><button data-close-modal>完成</button></div>
      <div id="tocList" class="toc-list"></div>
    </div>
  </section>

  <section id="noteSheet" class="modal" hidden>
    <button class="modal-scrim" data-close-modal aria-label="关闭共读感想"></button>
    <div class="sheet-card note-card">
      <div class="sheet-heading"><b>写下这一刻</b><button data-close-modal>完成</button></div>
      <blockquote id="noteQuote" class="note-quote"></blockquote>
      <textarea id="noteInput" rows="4" maxlength="900" placeholder="这一段让你想到什么？写给 Daddy 听。"></textarea>
      <button id="submitNote" class="primary-button">交给 Daddy</button>
      <section id="noteReply" class="note-reply" hidden></section>
    </div>
  </section>

  <section id="aiSheet" class="modal" hidden>
    <button class="modal-scrim" data-close-modal aria-label="关闭聊天窗口选择"></button>
    <div class="sheet-card ai-card">
      <div class="sheet-heading"><b>选择共读 Daddy</b><button data-close-modal>完成</button></div>
      <p class="sheet-copy">感想会作为真实消息发到这个窗口；它原有的记忆、人格、世界书和上下文都会继续生效。</p>
      <div id="conversationList" class="conversation-list"></div>
    </div>
  </section>

  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
