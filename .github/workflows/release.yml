name: Release Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: |
          cd web-ui
          pnpm install

      - name: Prepare build files
        run: |
          echo '{}' > app/google-services.json
          echo "" > local.properties
          # 生成 debug keystore
          keytool -genkey -v -keystore app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Debug,OU=Dev,O=OrangeChat,L=City,S=State,C=CN" -noprompt

      - name: Gradle Test and Build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests me.rerere.rikkahub.data.gadgetbridge.MiBand5HealthMapperTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-debug
          path: app/build/outputs/apk/debug/*.apk
